version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Python dependencies from uv.lock. The cooldown keeps brand-new releases out of PRs for
  # a while, so a compromised or broken release has time to be noticed and yanked.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-minor-days: 7
      semver-major-days: 14
    commit-message:
      prefix: "deps"
