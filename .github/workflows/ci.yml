name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Tests must never depend on credentials.
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v7

      # setup-uv no longer publishes floating major tags; pin the exact release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.7"
          python-version: "3.12"

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q
