name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Tests must never depend on credentials, and the live test never runs here.
      ANTHROPIC_API_KEY: ""
      ATM_LIVE_TESTS: ""
    steps:
      # Actions are pinned to full commit SHAs, with the release as a comment. Dependabot
      # updates SHA pins and the comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the secret scan covers every commit, not just the tip.
          fetch-depth: 0

      # Not covered by Dependabot: bump version and checksum together by hand.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Secret scan (full history)
        run: gitleaks git --redact --verbose .

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.7"
          python-version: "3.12"

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q

      # Install the built wheel in a clean environment and load the prompt from it, so a
      # prompt file missing from the package fails here rather than after release.
      - name: Packaged prompts load from the built wheel
        run: |
          uv build --wheel -o "$RUNNER_TEMP/dist"
          uv run --isolated --no-project --python 3.12 --with "$RUNNER_TEMP"/dist/*.whl \
            python -I scripts/check_wheel_prompts.py
